# SPA fallback: unknown paths (client-side routes) serve index.html instead
# of a static 404, since React Router owns routing once the app has loaded.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
